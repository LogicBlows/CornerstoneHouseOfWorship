# Decap CMS: the content editor at /admin.
# Every save is committed to GitHub; Netlify then rebuilds the live site.

backend:
  name: github
  repo: LogicBlows/CornerstoneHouseOfWorship
  branch: master # the live site

# When running locally (npm run cms + npm run dev), edit files on this computer instead of GitHub.
local_backend: true

logo_url: /logo-mark.png
media_folder: public/uploads
public_folder: /uploads

collections:
  # Sections are grouped by page. On each page the "accent" text is the part shown in italic purple.

  # ── Home ────────────────────────────────────────────────────────────────
  - name: home
    label: Home
    description: "Text and photos on the home page. The weekly schedule is under Church settings; leaders are under Our House."
    files:
      - name: home
        label: Home page
        file: src/content/pages/home.json
        fields:
          - { name: heroEyebrow, label: Small heading above the title, widget: string }
          - { name: heroTitle, label: Title, widget: string }
          - { name: heroAccent, label: Title (accent line), widget: string }
          - { name: heroIntro, label: Intro, widget: text }
          - { name: heroPhoto, label: Main photo (top of the page), widget: image, media_folder: /public/uploads/home, public_folder: /uploads/home, hint: "A wide (landscape) photo works best. It is shown behind the welcome text." }
          - { name: heroTint, label: Purple tint on the main photo, widget: boolean, default: true, hint: "Keeps the photo in the church colours and the text easy to read." }
          - { name: verseRef, label: Verse reference, widget: string }
          - { name: verseText, label: Verse, widget: string }
          - { name: verseAccent, label: Verse (accent ending), widget: string }
          - { name: foundationText, label: Text under the verse, widget: text }
          - { name: foundationPhotoLeft, label: Arch photo (left), widget: image }
          - { name: foundationPhotoRight, label: Arch photo (right), widget: image }
          - { name: weekTitle, label: Schedule heading, widget: string }
          - { name: weekAccent, label: Schedule heading (accent), widget: string }
          - { name: weekNote, label: Schedule note, widget: string }
          - { name: prayerTitle, label: Prayer heading, widget: string }
          - { name: prayerAccent, label: Prayer heading (accent), widget: string }
          - { name: prayerIntro, label: Prayer intro, widget: text }
          - { name: momentsTitle, label: Photos heading, widget: string }
          - { name: shepherdsTitle, label: Leaders heading, widget: string }
          - { name: shepherdsNote, label: Leaders note, widget: string }


  # ── Watch ───────────────────────────────────────────────────────────────
  # Everything on the Watch page: the live stream box, the latest message and up to 4 past messages.
  - name: watch
    label: Watch
    description: "Everything on the Watch page. The latest message is also shown on the home page."
    files:
      - name: live
        label: Live stream & page heading
        file: src/content/pages/watch.json
        fields:
          - { name: title, label: Page title, widget: string }
          - { name: accent, label: Page title (accent line), widget: string }
          - { name: liveTitle, label: Live stream heading, widget: string, hint: "e.g. Live every Sunday, 11:00 AM" }
          - { name: liveNote, label: Live stream note, widget: string }
          - { name: liveButton, label: Button text, widget: string, default: Open YouTube }
          - { name: liveUrl, label: Live stream / channel link, widget: string, required: false, hint: "Where the button goes, e.g. your YouTube channel or this week's live stream link." }
          - { name: channelText, label: Bottom link text, widget: string, default: "More on our YouTube channel →", hint: "The link under the past messages." }
          - { name: channelUrl, label: Bottom link address, widget: string, required: false, hint: "Usually your YouTube channel." }

      - name: messages
        label: Messages
        file: src/content/messages.json
        fields:
          - label: Latest message
            name: latest
            widget: object
            hint: "Featured at the top of the Watch page and on the home page."
            fields:
              - { name: title, label: Title, widget: string }
              - name: speaker
                label: Speaker
                widget: select
                default: pastor
                options:
                  - { label: "Pastor's Word", value: pastor }
                  - { label: "Apostle's Word", value: apostle }
              - { name: date, label: Date, widget: string, required: false, hint: "e.g. 12 Oct 2026" }
              - { name: youtube, label: YouTube link, widget: string, required: false, hint: "On YouTube click Share, then Copy, and paste the link here. The video thumbnail is added automatically." }
              - { name: thumbnail, label: Custom thumbnail, widget: image, required: false, media_folder: /public/uploads/sermons, public_folder: /uploads/sermons, hint: "Only if you want a different picture than YouTube's thumbnail." }
              - { name: scripture, label: Scripture, widget: string, required: false }
              - { name: summary, label: One-line summary, widget: text, required: false }
          - label: Past messages
            label_singular: past message
            name: past
            widget: list
            max: 4
            collapsed: true
            summary: "{{fields.title}} · {{fields.date}}"
            hint: "Up to 4. Drag to reorder. When you post a new latest message, you can move the old one here."
            fields:
              - { name: title, label: Title, widget: string }
              - name: speaker
                label: Speaker
                widget: select
                default: pastor
                options:
                  - { label: "Pastor's Word", value: pastor }
                  - { label: "Apostle's Word", value: apostle }
              - { name: date, label: Date, widget: string, required: false, hint: "e.g. 12 Oct 2026" }
              - { name: youtube, label: YouTube link, widget: string, required: false, hint: "On YouTube click Share, then Copy, and paste the link here. The video thumbnail is added automatically." }
              - { name: thumbnail, label: Custom thumbnail, widget: image, required: false, media_folder: /public/uploads/sermons, public_folder: /uploads/sermons, hint: "Only if you want a different picture than YouTube's thumbnail." }
          - label: Speakers
            name: speakers
            widget: object
            collapsed: true
            fields:
              - label: "Pastor's Word"
                name: pastor
                widget: object
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: series, label: Series name, widget: string }
                  - { name: channel, label: YouTube channel link, widget: string, required: false, hint: "Used for this speaker's \"More on YouTube\" links. Leave empty to use the church channel." }
              - label: "Apostle's Word"
                name: apostle
                widget: object
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: series, label: Series name, widget: string }
                  - { name: channel, label: YouTube channel link, widget: string, required: false, hint: "Used for this speaker's \"More on YouTube\" links. Leave empty to use the church channel." }

  # ── Pray ────────────────────────────────────────────────────────────────
  - name: pray
    label: Pray
    description: "Prayer page text and the answered-prayer testimonies."
    files:
      - name: pray
        label: Page text
        file: src/content/pages/pray.json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: accent, label: Title (accent), widget: string }
          - { name: intro, label: Intro, widget: text }
          - { name: topics, label: Prayer topics (home page form), widget: list }
          - { name: whatsappTitle, label: WhatsApp box heading, widget: string }
          - { name: whatsappNote, label: WhatsApp box note, widget: string }
          - { name: testimoniesTitle, label: Testimonies heading, widget: string }

      - name: testimonies
        label: Testimonies
        file: src/content/testimonies.json
        fields:
          - label: Testimonies
            name: testimonies
            widget: list
            add_to_top: true
            summary: "{{fields.name}} · {{fields.when}}"
            fields:
              - { name: quote, label: Testimony, widget: text }
              - { name: name, label: First name, widget: string }
              - { name: when, label: Month, widget: string }


  # ── Moments ─────────────────────────────────────────────────────────────
  # Each album is its own entry, so editing one album can never change another.
  - name: albums
    label: Moments (photo albums)
    label_singular: Album
    description: "Photo albums on the Moments page. The website shows up to 5 albums (by the Order number) and up to 50 photos per album. Keep photos under about 1 MB each."
    folder: src/content/albums
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{order}}. {{name}}"
    sortable_fields: [order, name]
    media_folder: /public/uploads/gallery
    public_folder: /uploads/gallery
    fields:
      - { name: name, label: Album name, widget: string, hint: "e.g. Sundays, Youth Camp 2026, Christmas" }
      - { name: order, label: Order on the page, widget: number, value_type: int, min: 1, max: 5, default: 1, hint: "1 = shown first. The first album's photos also appear on the home page." }
      - name: photos
        label: Photos
        widget: image
        media_library: { config: { multiple: true } }
        hint: "Click to choose photos. In the window that opens, upload or tick several photos at once, then click Choose selected. Up to 50 photos."

  - name: moments-page
    label: Moments page heading
    files:
      - name: moments
        label: Moments page heading
        file: src/content/pages/moments.json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: accent, label: Title (accent line), widget: string }


  # ── Our House ───────────────────────────────────────────────────────────
  - name: our-house
    label: Our House
    description: "Everything on the Our House page."
    files:
      - name: our-house
        label: Page text & photos
        file: src/content/pages/our-house.json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: accent, label: Title (accent), widget: string }
          - { name: story, label: Our story, widget: text }
          - { name: vision, label: Vision, widget: text }
          - { name: photo, label: Arch photo, widget: image }
          - { name: beliefsTitle, label: Beliefs heading, widget: string, hint: "e.g. Things we hold on to" }
          - { name: leadersTitle, label: Leaders heading, widget: string }
          - { name: teamLinkText, label: Team page link text, widget: string, default: Meet our team, hint: "The button under the leaders that opens the Our Team page." }
          - { name: ministriesTitle, label: Ministries heading, widget: string }
          - { name: ministriesIntro, label: Ministries intro, widget: string }
          - { name: ctaTitle, label: Closing banner heading, widget: string }
          - { name: ctaAccent, label: Closing banner heading (accent), widget: string }
          - { name: ctaPhoto, label: Closing banner photo, widget: image }

      - name: beliefs
        label: Beliefs
        file: src/content/beliefs.json
        fields:
          - label: Beliefs
            name: beliefs
            widget: list
            required: false
            hint: "Add as many as you like, drag to reorder, or remove them all to hide this section."
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Statement, widget: text, required: false }

      - name: ministries
        label: Ministries
        file: src/content/ministries.json
        fields:
          - label: Ministries
            name: ministries
            widget: list
            required: false
            hint: "The rows under Find your place. Add, edit, drag to reorder, or remove them all to hide this section."
            summary: "{{fields.name}} · {{fields.when}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: when, label: When it meets, widget: string }
              - { name: blurb, label: Description, widget: text, required: false }

      - name: leaders
        label: Pastors & leaders
        file: src/content/leaders.json
        fields:
          - label: Leaders
            name: leaders
            widget: list
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: photo, label: Portrait, widget: image, required: false, media_folder: /public/uploads/leaders, public_folder: /uploads/leaders, hint: "A portrait (taller than wide) looks best." }
              - { name: showOnHome, label: Show on home page, widget: boolean, default: false, hint: "The home page shows up to three." }


  # ── Our Team ────────────────────────────────────────────────────────────
  # Each team is its own entry, so editing one team can never change another.
  - name: teams
    label: Our Team
    label_singular: Team
    description: "Teams on the Our Team page (opened from the Meet our team button on Our House). Pastors and leaders are edited under Our House."
    folder: src/content/teams
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{order}}. {{name}}"
    sortable_fields: [order, name]
    media_folder: /public/uploads/team
    public_folder: /uploads/team
    fields:
      - { name: name, label: Team name, widget: string, hint: "e.g. Worship Team, Media Team, Welcome Team" }
      - { name: order, label: Order on the page, widget: number, value_type: int, min: 1, default: 1, hint: "1 = shown first." }
      - { name: description, label: Short description, widget: text, required: false }
      - label: Members
        label_singular: member
        name: members
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.name}} · {{fields.role}}"
        hint: "Add as many as you like. Drag to reorder."
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string, required: false, hint: "e.g. Keys, Vocals, Camera, Team lead" }
          - { name: photo, label: Photo, widget: image, required: false, hint: "A portrait (taller than wide) looks best." }

  - name: team-page
    label: Our Team page heading
    files:
      - name: our-team
        label: Our Team page heading
        file: src/content/pages/our-team.json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: accent, label: Title (accent), widget: string }
          - { name: intro, label: Intro, widget: text, required: false }

  # ── Church settings ─────────────────────────────────────────────────────
  - name: settings
    label: Church settings
    description: "Used across the whole site: contact details, weekly schedule and footer."
    files:
      - name: details
        label: Contact, address & social links
        file: src/content/church.json
        fields:
          - { name: name, label: Church name, widget: string }
          - { name: foundedYear, label: Year founded, widget: number, value_type: int }
          - label: Address
            name: address
            widget: object
            fields:
              - { name: street, label: Street, widget: string }
              - { name: area, label: "Area, city", widget: string }
              - { name: pin, label: PIN code, widget: string }
              - { name: mapsUrl, label: Google Maps link, widget: string, hint: "In Google Maps: Share → Copy link" }
          - label: Contact
            name: contact
            widget: object
            fields:
              - { name: phone, label: Phone, widget: string }
              - { name: email, label: Email, widget: string }
              - { name: whatsappNumber, label: WhatsApp number, widget: string, required: false, hint: "With country code, e.g. 91 76786 10090" }
              - { name: whatsappCommunityUrl, label: WhatsApp community invite link, widget: string, required: false }
          - label: Social links
            name: social
            widget: object
            fields:
              - { name: youtube, label: YouTube, widget: string }
              - { name: instagram, label: Instagram, widget: string }
              - { name: facebook, label: Facebook, widget: string }

      - name: schedule
        label: Weekly schedule
        file: src/content/schedule.json
        fields:
          - label: Gatherings
            name: gatherings
            widget: list
            summary: "{{fields.day}} · {{fields.name}} · {{fields.time}}"
            fields:
              - { name: day, label: Day, widget: select, options: [Sun, Mon, Tue, Wed, Thu, Fri, Sat] }
              - { name: name, label: Name, widget: string }
              - { name: time, label: Time, widget: string, hint: "e.g. 11:00 AM" }
              - { name: where, label: Where, widget: string, required: false }
              - { name: featured, label: Main Sunday service, widget: boolean, default: false, hint: "Highlighted, and its time is shown in the header button. Tick only one." }
              - { name: prayer, label: Show under "Pray with us", widget: boolean, default: false }

      - name: footer
        label: Footer text
        file: src/content/pages/footer.json
        fields:
          - { name: whatsappText, label: WhatsApp community text, widget: text }

